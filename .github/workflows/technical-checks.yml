name: Technical checks

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  portable-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run portable checks
        run: make check
